<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ECEBEE">
<title>Spielzettel</title>
<style>
  :root{
    --paper:#ECEBEE; --sheet:#F8F7F9; --ink:#17171C; --grid:#9696A2;
    --pen:#2C47A6; --neg:#B3261E; --tint:#E2E4F1; --focus:#FFF4C2;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
  body{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--pen);outline-offset:1px}

  /* ---------- Setup ---------- */
  .setup{max-width:440px;width:100%;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px;overflow:auto}
  .setup h1{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:0 0 6px;letter-spacing:.01em}
  .setup p{margin:0 0 24px;color:#55555f;line-height:1.45}
  .prow{display:flex;gap:8px;margin-bottom:10px}
  .prow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink)}
  .prow button{width:48px;border:1.5px solid var(--grid);background:transparent;border-radius:6px;font-size:1.3rem;color:#55555f}
  .btn{display:block;width:100%;padding:14px;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-size:1.05rem;font-weight:600;margin-top:18px}
  .btn.ghost{background:transparent;color:var(--ink);margin-top:10px}
  .btn[disabled]{opacity:.35}

  /* ---------- Game ---------- */
  .bar{display:flex;align-items:center;justify-content:space-between;padding:max(8px,env(safe-area-inset-top)) 14px 8px;border-bottom:1.5px solid var(--ink);background:var(--paper)}
  .bar h1{font-family:var(--serif);font-size:1.25rem;margin:0}
  .bar button{background:none;border:1.5px solid var(--ink);border-radius:6px;padding:6px 12px;font-size:.9rem}
  #sheet{flex:1;overflow:auto;background:var(--sheet);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  table{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed}
  col.lab{width:58px}
  col.pl{width:calc((100vw - 58px)/4);min-width:82px}
  th,td{padding:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);background:var(--sheet)}
  thead th{position:sticky;top:0;z-index:3;border-bottom:2px solid var(--ink);background:var(--paper)}
  thead th input{width:100%;font:inherit;font-family:var(--serif);font-weight:700;font-size:1rem;text-align:center;border:0;background:transparent;padding:11px 4px;color:var(--ink);text-overflow:ellipsis}
  thead th input:focus{background:var(--focus);outline:none}
  .lab-c{position:sticky;left:0;z-index:2;text-align:center;font-family:var(--serif);font-size:1.15rem;font-weight:700;border-right:2px solid var(--ink)!important;background:var(--paper)}
  thead .lab-c{z-index:4}
  tfoot td{position:sticky;bottom:0;z-index:3;background:var(--paper);border-top:2px solid var(--ink);border-bottom:0;text-align:center;padding:8px 2px}
  tfoot .lab-c{z-index:4;font-size:.8rem;font-family:var(--sans);font-weight:600;color:#55555f}
  tr.w td, tr.w .lab-c{background:var(--tint)}
  tr.w .lab-c{font-size:1.05rem;color:var(--pen)}
  tr.x td{background:#F1F0F4}
  tr.x .lab-c{font-family:var(--sans);font-size:.72rem;font-weight:600;color:#55555f}
  tr.sep td,tr.sep th{border-bottom:2px solid var(--ink)}

  .c{position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-margin:70px 64px 110px 64px}
  .c input.v{width:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:1.3rem;font-weight:600;padding:0;height:30px;color:var(--ink);font-variant-numeric:tabular-nums}
  .c input.v:focus{outline:none}
  .c:focus-within{background:var(--focus);box-shadow:inset 0 0 0 2px var(--pen)}
  .c input.v.neg{color:var(--neg)}
  .s{height:18px;font-size:.78rem;color:var(--pen);font-variant-numeric:tabular-nums;line-height:18px}
  .s.neg{color:var(--neg)}
  .tools{display:none;height:22px;gap:6px}
  .c:focus-within .tools{display:flex}
  .c:focus-within .s{display:none}
  .tools button{width:30px;height:22px;padding:0;border:1px solid var(--pen);background:var(--sheet);color:var(--pen);border-radius:4px;font-size:.9rem;line-height:1;font-weight:700}

  .ring{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:52px;padding:0 6px;border:2.5px solid var(--ink);border-radius:50%;font-family:var(--serif);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sheet)}
  .ring.lead{background:var(--ink);color:var(--sheet)}
  .ring.neg{color:var(--neg)}
  .ring.lead.neg{color:#FFB4AB}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  /* ---------- Speicher (localStorage, mit Fallback) ---------- */
  var KEY='spielzettel-v1', mem=null;
  function load(){
    try{ var r=localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){ if(mem) return JSON.parse(mem); }
    return null;
  }
  function save(){
    var s=JSON.stringify(state);
    try{ localStorage.setItem(KEY,s); }catch(e){ mem=s; }
  }

  /* ---------- Zeilen laut Spielzettel ---------- */
  var ROWS=[];
  for(var i=1;i<=10;i++) ROWS.push({l:String(i)});
  ROWS.push({l:'W10',w:1});
  for(i=9;i>=1;i--) ROWS.push({l:String(i)});
  ROWS.push({l:'W10',w:1,sep:1});
  for(i=0;i<3;i++) ROWS.push({l:'Extra',x:1});
  ROWS[9].sep=1;

  var MAX=8, MIN=2;
  var state=load()||{started:false,names:['','','',''],players:[],scores:[]};
  var app=document.getElementById('app');

  function el(tag,attrs,kids){
    var e=document.createElement(tag);
    for(var k in (attrs||{})){
      if(k==='class') e.className=attrs[k];
      else if(k==='text') e.textContent=attrs[k];
      else e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function fmt(n){ return String(n).replace('-','\u2212'); }

  /* ---------- Setup-Ansicht ---------- */
  function renderSetup(){
    app.innerHTML='';
    var box=el('div',{class:'setup'});
    box.appendChild(el('h1',{text:'Spielzettel'}));
    box.appendChild(el('p',{text:'Trag die Namen der Mitspieler ein. Jeder Name wird eine Spalte.'}));
    var list=el('div');
    box.appendChild(list);

    function draw(){
      list.innerHTML='';
      state.names.forEach(function(n,i){
        var inp=el('input',{type:'text',placeholder:'Spieler '+(i+1),maxlength:'14',autocomplete:'off','aria-label':'Name Spieler '+(i+1)});
        inp.value=n;
        inp.addEventListener('input',function(){ state.names[i]=inp.value; save(); });
        inp.addEventListener('keydown',function(e){
          if(e.key==='Enter'){ var nx=list.querySelectorAll('input')[i+1]; if(nx) nx.focus(); else inp.blur(); }
        });
        var row=el('div',{class:'prow'},[inp]);
        if(state.names.length>MIN){
          var rm=el('button',{type:'button','aria-label':'Spieler '+(i+1)+' entfernen',text:'\u00D7'});
          rm.addEventListener('click',function(){ state.names.splice(i,1); save(); draw(); });
          row.appendChild(rm);
        }
        list.appendChild(row);
      });
      add.style.display = state.names.length<MAX ? '' : 'none';
    }
    var add=el('button',{type:'button',class:'btn ghost',text:'+ Spieler hinzufügen'});
    add.addEventListener('click',function(){
      if(state.names.length<MAX){ state.names.push(''); save(); draw(); var ins=list.querySelectorAll('input'); ins[ins.length-1].focus(); }
    });
    var start=el('button',{type:'button',class:'btn',text:'Spiel starten'});
    start.addEventListener('click',function(){
      state.players=state.names.map(function(n,i){ return n.trim()||('Spieler '+(i+1)); });
      state.scores=ROWS.map(function(){ return state.players.map(function(){ return null; }); });
      state.started=true; save(); renderGame();
    });
    box.appendChild(add); box.appendChild(start);
    app.appendChild(box);
    draw();
  }

  /* ---------- Spiel-Ansicht ---------- */
  var inputs=[], sums=[], rings=[];

  function renderGame(){
    app.innerHTML='';
    var n=state.players.length;
    inputs=[]; sums=[]; rings=[];

    var bar=el('div',{class:'bar'},[el('h1',{text:'Spielzettel'})]);
    var nb=el('button',{type:'button',text:'Neues Spiel'});
    nb.addEventListener('click',function(){
      if(confirm('Neues Spiel starten? Alle Punkte werden gelöscht.')){
        state.started=false; state.names=state.players.slice(); state.scores=[]; save(); renderSetup();
      }
    });
    bar.appendChild(nb);
    app.appendChild(bar);

    var table=el('table');
    var cg=el('colgroup',{},[el('col',{class:'lab'})]);
    for(var p=0;p<n;p++) cg.appendChild(el('col',{class:'pl'}));
    table.appendChild(cg);

    var thead=el('thead'), hr=el('tr');
    hr.appendChild(el('th',{class:'lab-c',text:'Name'}));
    state.players.forEach(function(name,p){
      var inp=el('input',{type:'text',maxlength:'14','aria-label':'Name Spalte '+(p+1)});
      inp.value=name;
      inp.addEventListener('input',function(){ state.players[p]=inp.value; save(); });
      inp.addEventListener('blur',function(){ if(!inp.value.trim()){ inp.value='Spieler '+(p+1); state.players[p]=inp.value; save(); } });
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') inp.blur(); });
      hr.appendChild(el('th',{},[inp]));
    });
    thead.appendChild(hr); table.appendChild(thead);

    var tbody=el('tbody');
    ROWS.forEach(function(row,r){
      var tr=el('tr',{class:(row.w?'w ':'')+(row.x?'x ':'')+(row.sep?'sep':'')});
      tr.appendChild(el('th',{class:'lab-c',text:row.l,scope:'row'}));
      inputs[r]=[]; sums[r]=[];
      for(var p=0;p<n;p++){
        (function(r,p){
          var inp=el('input',{class:'v',type:'text',inputmode:'numeric',autocomplete:'off',enterkeyhint:'next','aria-label':'Runde '+row.l+', '+state.players[p]});
          var v=state.scores[r][p];
          inp.value = v===null ? '' : String(v);
          var s=el('div',{class:'s'});
          var minus=el('button',{type:'button',tabindex:'-1','aria-label':'Vorzeichen wechseln',text:'\u00B1'});
          var next=el('button',{type:'button',tabindex:'-1','aria-label':'Nächstes Feld',text:'\u203A'});
          var tools=el('div',{class:'tools'},[minus,next]);
          function press(btn,fn){
            var h=function(e){ e.preventDefault(); fn(); };
            btn.addEventListener('touchstart',h,{passive:false});
            btn.addEventListener('mousedown',h);
          }
          press(minus,function(){
            var t=inp.value;
            inp.value = t.charAt(0)==='-' ? t.slice(1) : '-'+t;
            commit(r,p,inp); inp.focus();
          });
          press(next,function(){ goNext(r,p); });
          inp.addEventListener('input',function(){ commit(r,p,inp); });
          inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); goNext(r,p); } });
          inp.addEventListener('focus',function(){ setTimeout(function(){ inp.select(); },0); inp.parentNode.scrollIntoView({block:'nearest',inline:'nearest'}); });
          var c=el('div',{class:'c'},[inp,s,tools]);
          tr.appendChild(el('td',{},[c]));
          inputs[r][p]=inp; sums[r][p]=s;
        })(r,p);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var tfoot=el('tfoot'), fr=el('tr');
    fr.appendChild(el('td',{class:'lab-c',text:'Summe'}));
    for(var q=0;q<n;q++){
      var ring=el('span',{class:'ring',text:'0'});
      rings[q]=ring;
      fr.appendChild(el('td',{},[ring]));
    }
    tfoot.appendChild(fr); table.appendChild(tfoot);

    var sheet=el('div',{id:'sheet'},[table]);
    app.appendChild(sheet);
    // Spalten ab 5 Spielern: feste Mindestbreite
    if(n>4) table.style.width=(58+n*82)+'px';
    update();
  }

  function commit(r,p,inp){
    var t=inp.value.replace(/[^\d-]/g,'');
    t=(t.charAt(0)==='-'?'-':'')+t.replace(/-/g,'');
    t=t.replace(/^(-?)0+(?=\d)/,'$1');
    if(t.length>6) t=t.slice(0,t.charAt(0)==='-'?7:6);
    inp.value=t;
    var num=parseInt(t,10);
    state.scores[r][p]=isNaN(num)?null:num;
    save(); update();
  }

  function goNext(r,p){
    var n=state.players.length, nr=r, np=p+1;
    if(np>=n){ np=0; nr=r+1; }
    if(nr<ROWS.length) inputs[nr][np].focus();
    else inputs[r][p].blur();
  }

  function update(){
    var n=state.players.length, tot=[], any=[];
    for(var p=0;p<n;p++){ tot[p]=0; any[p]=false; }
    for(var r=0;r<ROWS.length;r++){
      for(p=0;p<n;p++){
        var v=state.scores[r][p];
        if(v!==null){ tot[p]+=v; any[p]=true; }
        var s=sums[r][p];
        if(v===null){ s.textContent=''; s.className='s'; }
        else { s.textContent=fmt(tot[p]); s.className='s'+(tot[p]<0?' neg':''); }
        inputs[r][p].classList.toggle('neg',v!==null&&v<0);
      }
    }
    var best=-Infinity;
    for(p=0;p<n;p++) if(any[p]&&tot[p]>best) best=tot[p];
    for(p=0;p<n;p++){
      rings[p].textContent=fmt(tot[p]);
      rings[p].className='ring'+(any[p]&&tot[p]===best?' lead':'')+(tot[p]<0?' neg':'');
    }
  }

  if(state.started && state.players.length && state.scores.length===ROWS.length) renderGame();
  else{ state.started=false; if(!state.names||!state.names.length) state.names=['','','','']; renderSetup(); }
})();
</script>
</body>
</html>

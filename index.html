<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#D9C49C">
<title>Piratenpoker</title>
<style>
  :root{
    --paper:#D9C49C; --sheet:#EFE2BE; --ink:#241607; --grid:#B49A6C;
    --pen:#6B3610; --neg:#9B1C1C; --tint:#E6D4A3; --focus:#F5DE8A;
    --muted:#6E5A38; --neg-on-dark:#F0A98A; --extra:#E3D2A8;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%;
    background-color:var(--paper);
    background-image:
      radial-gradient(ellipse 60% 40% at 18% 22%, rgba(90,46,14,.12), transparent 60%),
      radial-gradient(ellipse 55% 45% at 85% 15%, rgba(90,46,14,.09), transparent 60%),
      radial-gradient(ellipse 65% 45% at 80% 85%, rgba(90,46,14,.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 15% 90%, rgba(90,46,14,.08), transparent 60%);
    background-attachment:fixed;
  }
  body{display:flex;flex-direction:column;height:100dvh}
  button{font:inherit;color:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--pen);outline-offset:1px}
  #app{display:flex;flex-direction:column;height:100%;min-height:0}

  /* ---------- Views (Auth/Home/Friends/History/Setup) ---------- */
  .view{max-width:440px;width:100%;margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 20px 40px;overflow:auto}
  .view h1{font-family:var(--serif);font-size:2.2rem;font-weight:700;margin:0 0 6px;letter-spacing:.01em;text-shadow:0 1px 0 rgba(255,246,219,.45)}
  .brand::before{content:'\2693';margin-right:8px;font-size:.75em;opacity:.85}
  .view p.lead{margin:0 0 24px;color:var(--muted);line-height:1.45}
  .prow{display:flex;gap:8px;margin-bottom:10px}
  .prow input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:13px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink)}
  .prow button{width:48px;border:1.5px solid var(--grid);background:transparent;border-radius:6px;font-size:1.3rem;color:var(--muted)}
  .btn{display:block;width:100%;padding:14px;border-radius:6px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sheet);font-size:1.05rem;font-weight:600;margin-top:18px}
  .btn.ghost{background:transparent;color:var(--ink);margin-top:10px}
  .btn[disabled]{opacity:.35}

  .tabs{display:flex;border:1.5px solid var(--ink);border-radius:6px;overflow:hidden;margin-bottom:20px}
  .tabs button{flex:1;padding:11px;background:transparent;border:0;font-weight:600;font-size:.95rem}
  .tabs button.active{background:var(--ink);color:var(--sheet)}

  .field{margin-bottom:12px}
  .field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
  .field input{width:100%;font:inherit;font-size:1.05rem;padding:13px 14px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);color:var(--ink)}

  .msg{margin:0 0 14px;font-size:.88rem;line-height:1.4}
  .msg.err{color:var(--neg)}
  .msg.ok{color:var(--pen)}

  .menu-btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px;border:1.5px solid var(--ink);border-radius:6px;background:var(--sheet);margin-bottom:10px;font-size:1.05rem;font-weight:600;text-align:left}
  .menu-btn small{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:2px}

  .sectitle{font-family:var(--serif);font-size:1.05rem;font-weight:700;margin:22px 0 8px}
  .sectitle:first-child{margin-top:0}

  .row-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--grid)}
  .row-item:last-child{border-bottom:0}
  .row-item .nm{font-weight:600}
  .row-item .actions{display:flex;gap:6px}
  .row-item button{border:1.5px solid var(--ink);background:transparent;border-radius:6px;padding:6px 10px;font-size:.82rem}
  .row-item button.primary{background:var(--ink);color:var(--sheet)}

  .checkrow{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--grid)}
  .checkrow input[type=checkbox]{width:20px;height:20px;flex:none}
  .checkrow label{flex:1}

  .hist-row{display:block;width:100%;text-align:left;padding:14px 2px;border-bottom:1px solid var(--grid);background:transparent;border-left:0;border-right:0;border-top:0}
  .hist-row .nm{font-weight:700;font-family:var(--serif)}
  .hist-row .sub{font-size:.8rem;color:var(--muted);margin-top:2px}
  .hist-row .pills{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--ink);border-radius:20px;padding:3px 10px;font-size:.8rem;font-variant-numeric:tabular-nums}
  .pill.lead{background:var(--ink);color:var(--sheet)}
  .pill.neg{color:var(--neg)}
  .pill.lead.neg{color:var(--neg-on-dark)}

  .empty{color:var(--muted);font-size:.9rem;padding:14px 2px}

  /* ---------- Game ---------- */
  .topbar{display:flex;align-items:center;gap:8px;padding:max(8px,env(safe-area-inset-top)) 14px 8px;border-bottom:1.5px solid var(--ink);background:var(--paper)}
  .topbar h1{font-family:var(--serif);font-size:1.1rem;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 rgba(255,246,219,.45)}
  .topbar button{background:none;border:1.5px solid var(--ink);border-radius:6px;padding:6px 10px;font-size:.85rem;white-space:nowrap}
  .finished-note{text-align:center;font-size:.8rem;color:var(--muted);padding:6px 0 0}
  #sheet{flex:1;min-height:0;overflow:auto;background:var(--sheet);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  table{border-collapse:separate;border-spacing:0;min-width:100%;table-layout:fixed}
  col.lab{width:58px}
  col.pl{width:calc((100vw - 58px)/4);min-width:82px}
  th,td{padding:0;border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);background:var(--sheet)}
  thead th{position:sticky;top:0;z-index:3;border-bottom:2px solid var(--ink);background:var(--paper);font-family:var(--serif);font-weight:700;font-size:1rem;text-align:center;padding:11px 4px;color:var(--ink)}
  .lab-c{position:sticky;left:0;z-index:2;text-align:center;font-family:var(--serif);font-size:1.15rem;font-weight:700;border-right:2px solid var(--ink)!important;background:var(--paper)}
  thead .lab-c{z-index:4}
  .totalbar{flex:none;overflow:hidden;border-top:2px solid var(--ink);background:var(--paper)}
  .totalbar table{border-collapse:separate;border-spacing:0;table-layout:fixed}
  .totalbar td{border:0;background:var(--paper);text-align:center;padding:8px 2px}
  .totalbar .lab-c{font-size:.8rem;font-family:var(--sans);font-weight:600;color:var(--muted)}
  tr.w td, tr.w .lab-c{background:var(--tint)}
  tr.w .lab-c{font-size:1.05rem;color:var(--pen)}
  tr.x td{background:var(--extra)}
  tr.x .lab-c{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--muted)}
  tr.sep td,tr.sep th{border-bottom:2px solid var(--ink)}

  .c{position:relative;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-margin:70px 64px 110px 64px}
  .c input.v{width:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:1.3rem;font-weight:600;padding:0;height:30px;color:var(--ink);font-variant-numeric:tabular-nums}
  .c input.v:focus{outline:none}
  .c input.v:disabled{color:var(--ink);opacity:1;-webkit-text-fill-color:var(--ink)}
  .c:focus-within{background:var(--focus);box-shadow:inset 0 0 0 2px var(--pen)}
  .c input.v.neg{color:var(--neg)}
  .s{height:18px;font-size:.78rem;color:var(--pen);font-variant-numeric:tabular-nums;line-height:18px}
  .s.neg{color:var(--neg)}
  .tools{display:none;height:22px;gap:6px}
  .c:focus-within .tools{display:flex}
  .c:focus-within .s{display:none}
  .tools button{width:30px;height:22px;padding:0;border:1px solid var(--pen);background:var(--sheet);color:var(--pen);border-radius:4px;font-size:.9rem;line-height:1;font-weight:700}
  .dealer-mark{position:absolute;top:3px;right:3px;width:15px;height:15px;border-radius:50%;border:1.2px solid var(--pen);color:var(--pen);background:var(--sheet);font-family:var(--sans);font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none}

  .ring{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:52px;padding:0 6px;border:2.5px solid var(--ink);border-radius:50%;font-family:var(--serif);font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;background:var(--sheet)}
  .ring.lead{background:var(--ink);color:var(--sheet)}
  .ring.neg{color:var(--neg)}
  .ring.lead.neg{color:var(--neg-on-dark)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.90.0/dist/umd/supabase.js"></script>
<script>
(function(){
  /* ====== Supabase-Konfiguration ======
     Nach dem Anlegen des Supabase-Projekts hier Projekt-URL und
     den "anon public" Key eintragen (Project Settings -> API). */
  var SUPABASE_URL = 'https://kdwlksavzzacbcqzlhev.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_enPDk044mpIbqRTsnuEewA_2eK6rTHw';
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  /* ---------- Zeilen laut Spielzettel ---------- */
  var ROWS=[];
  for(var i=1;i<=10;i++) ROWS.push({l:String(i)});
  ROWS.push({l:'W10',w:1});
  for(i=9;i>=1;i--) ROWS.push({l:String(i)});
  ROWS.push({l:'W10',w:1,sep:1});
  for(i=0;i<3;i++) ROWS.push({l:'Extra',x:1});
  ROWS[9].sep=1;

  var MAX=8, MIN=2;
  var app=document.getElementById('app');

  var state={ session:null, profile:null, view:'loading', friends:[], incoming:[], outgoing:[], history:[], currentGame:null };

  function el(tag,attrs,kids){
    var e=document.createElement(tag);
    for(var k in (attrs||{})){
      if(k==='class') e.className=attrs[k];
      else if(k==='text') e.textContent=attrs[k];
      else e.setAttribute(k,attrs[k]);
    }
    (kids||[]).forEach(function(c){ e.appendChild(c); });
    return e;
  }
  function fmt(n){ return String(n).replace('-','−'); }
  function makeMenuBtn(title,sub){
    var span=document.createElement('span');
    span.appendChild(document.createTextNode(title));
    var small=document.createElement('small'); small.textContent=sub;
    span.appendChild(small);
    var btn=el('button',{type:'button',class:'menu-btn'},[span, el('span',{text:'→'})]);
    return btn;
  }

  /* ---------- Routing ---------- */
  function render(){
    app.innerHTML='';
    if(state.view==='auth') return renderAuth();
    if(state.view==='home') return renderHome();
    if(state.view==='friends') return renderFriends();
    if(state.view==='setup') return renderSetup();
    if(state.view==='history') return renderHistory();
    if(state.view==='game') return renderGame();
    app.appendChild(el('div',{class:'view'},[el('p',{class:'lead',text:'Lädt…'})]));
  }

  /* ---------- Auth ---------- */
  var authMode='login', authMsg=null;
  function renderAuth(){
    var box=el('div',{class:'view'});
    box.appendChild(el('h1',{class:'brand',text:'Piratenpoker'}));
    box.appendChild(el('p',{class:'lead',text:'Melde dich an, um Spiele zu speichern und Mitspieler einzuladen.'}));

    var tLogin=el('button',{type:'button',text:'Anmelden',class:authMode==='login'?'active':''});
    var tReg=el('button',{type:'button',text:'Registrieren',class:authMode==='register'?'active':''});
    tLogin.addEventListener('click',function(){ authMode='login'; authMsg=null; render(); });
    tReg.addEventListener('click',function(){ authMode='register'; authMsg=null; render(); });
    box.appendChild(el('div',{class:'tabs'},[tLogin,tReg]));

    if(authMsg) box.appendChild(el('p',{class:'msg '+(authMsg.type==='err'?'err':'ok'),text:authMsg.text}));

    var nameField=null;
    if(authMode==='register'){
      nameField=el('input',{type:'text',placeholder:'z.B. Chris',maxlength:'24',autocomplete:'name'});
      box.appendChild(el('div',{class:'field'},[el('label',{text:'Anzeigename'}),nameField]));
    }
    var emailField=el('input',{type:'email',placeholder:'du@beispiel.de',autocomplete:'email'});
    var pwField=el('input',{type:'password',placeholder:'Passwort',autocomplete:authMode==='login'?'current-password':'new-password'});
    box.appendChild(el('div',{class:'field'},[el('label',{text:'E-Mail'}),emailField]));
    box.appendChild(el('div',{class:'field'},[el('label',{text:'Passwort'}),pwField]));

    var submit=el('button',{type:'button',class:'btn',text:authMode==='login'?'Anmelden':'Konto erstellen'});
    submit.addEventListener('click',function(){
      authMsg=null;
      var email=emailField.value.trim(), pw=pwField.value;
      if(!email||!pw){ authMsg={type:'err',text:'Bitte E-Mail und Passwort eingeben.'}; render(); return; }
      submit.disabled=true;
      if(authMode==='login'){
        sb.auth.signInWithPassword({email:email,password:pw}).then(function(res){
          submit.disabled=false;
          if(res.error){ authMsg={type:'err',text:res.error.message}; render(); }
        });
      } else {
        var name=(nameField.value||'').trim();
        sb.auth.signUp({email:email,password:pw,options:{data:{display_name:name||email.split('@')[0]},emailRedirectTo:window.location.href.split('#')[0].split('?')[0]}}).then(function(res){
          submit.disabled=false;
          if(res.error){ authMsg={type:'err',text:res.error.message}; render(); return; }
          if(!res.data.session){
            authMsg={type:'ok',text:'Fast fertig! Bitte bestätige deine E-Mail-Adresse über den Link, den wir dir geschickt haben, und melde dich danach an.'};
            authMode='login'; render();
          }
        });
      }
    });
    box.appendChild(submit);
    app.appendChild(box);
  }

  function loadProfile(uid){
    return sb.from('profiles').select('*').eq('id',uid).single().then(function(res){
      if(res.error){ console.error(res.error); return null; }
      state.profile=res.data;
      return res.data;
    });
  }

  sb.auth.onAuthStateChange(function(event,session){
    state.session=session;
    if(session){
      loadProfile(session.user.id).then(function(){
        if(state.view==='loading'||state.view==='auth') state.view='home';
        render();
      });
    } else {
      state.profile=null; state.currentGame=null; state.view='auth';
      render();
    }
  });

  /* ---------- Home ---------- */
  function renderHome(){
    var box=el('div',{class:'view'});
    box.appendChild(el('h1',{class:'brand',text:'Piratenpoker'}));
    box.appendChild(el('p',{class:'lead',text:'Angemeldet als '+(state.profile?state.profile.display_name:'')+' ('+state.session.user.email+')'}));

    var newGameBtn=makeMenuBtn('Neues Spiel','Mitspieler auswählen und loslegen');
    newGameBtn.addEventListener('click',function(){ openSetup(); });
    var histBtn=makeMenuBtn('Verlauf','Vergangene Partien ansehen');
    histBtn.addEventListener('click',function(){ openHistory(); });
    var friendsBtn=makeMenuBtn('Freunde','Mitspieler einladen und verwalten');
    friendsBtn.addEventListener('click',function(){ openFriends(); });
    box.appendChild(newGameBtn); box.appendChild(histBtn); box.appendChild(friendsBtn);

    var logout=el('button',{type:'button',class:'btn ghost',text:'Abmelden'});
    logout.addEventListener('click',function(){ sb.auth.signOut(); });
    box.appendChild(logout);

    app.appendChild(box);
  }

  /* ---------- Freunde ---------- */
  function openFriends(){ state.view='friends'; render(); loadFriends().then(function(){ if(state.view==='friends') render(); }); }

  function loadFriends(){
    var uid=state.session.user.id;
    return sb.from('friendships')
      .select('id,status,requester_id,addressee_id,requester:profiles!friendships_requester_id_fkey(id,display_name,email),addressee:profiles!friendships_addressee_id_fkey(id,display_name,email)')
      .or('requester_id.eq.'+uid+',addressee_id.eq.'+uid)
      .then(function(res){
        if(res.error){ console.error(res.error); return; }
        state.friends=[]; state.incoming=[]; state.outgoing=[];
        (res.data||[]).forEach(function(f){
          var other = f.requester_id===uid ? f.addressee : f.requester;
          if(f.status==='accepted') state.friends.push({friendshipId:f.id, profile:other});
          else if(f.addressee_id===uid) state.incoming.push({friendshipId:f.id, profile:other});
          else state.outgoing.push({friendshipId:f.id, profile:other});
        });
      });
  }

  function renderFriends(){
    var box=el('div',{class:'view'});
    var back=el('button',{type:'button',class:'btn ghost',text:'← Start'});
    back.addEventListener('click',function(){ state.view='home'; render(); });
    box.appendChild(back);
    box.appendChild(el('h1',{text:'Freunde'}));
    box.appendChild(el('p',{class:'lead',text:'Lade jemanden per E-Mail ein. Die Person braucht bereits ein Piratenpoker-Konto.'}));

    var emailField=el('input',{type:'email',placeholder:'freund@beispiel.de'});
    var addBtn=el('button',{type:'button',class:'btn',text:'Einladen'});
    addBtn.style.marginTop='0';
    var msgEl=el('p',{class:'msg'});
    addBtn.addEventListener('click',function(){
      var email=emailField.value.trim().toLowerCase();
      msgEl.textContent=''; msgEl.className='msg';
      if(!email) return;
      if(state.profile && email===state.profile.email.toLowerCase()){ msgEl.textContent='Das bist du selbst.'; msgEl.className='msg err'; return; }
      sb.from('profiles').select('id,display_name,email').eq('email',email).maybeSingle().then(function(res){
        if(res.error || !res.data){ msgEl.textContent='Kein Konto mit dieser E-Mail gefunden.'; msgEl.className='msg err'; return; }
        sb.from('friendships').insert({requester_id:state.session.user.id, addressee_id:res.data.id, status:'pending'}).then(function(r2){
          if(r2.error){ msgEl.textContent = r2.error.code==='23505' ? 'Ihr seid bereits verbunden oder die Einladung läuft schon.' : r2.error.message; msgEl.className='msg err'; return; }
          emailField.value=''; msgEl.textContent='Einladung gesendet.'; msgEl.className='msg ok'; loadFriends().then(render);
        });
      });
    });
    box.appendChild(el('div',{class:'prow'},[emailField]));
    box.appendChild(addBtn); box.appendChild(msgEl);

    box.appendChild(el('div',{class:'sectitle',text:'Offene Einladungen an dich'}));
    if(!state.incoming.length) box.appendChild(el('div',{class:'empty',text:'Keine offenen Einladungen.'}));
    state.incoming.forEach(function(f){
      var acc=el('button',{type:'button',class:'primary',text:'Annehmen'});
      acc.addEventListener('click',function(){ sb.from('friendships').update({status:'accepted'}).eq('id',f.friendshipId).then(function(){ loadFriends().then(render); }); });
      var dec=el('button',{type:'button',text:'Ablehnen'});
      dec.addEventListener('click',function(){ sb.from('friendships').delete().eq('id',f.friendshipId).then(function(){ loadFriends().then(render); }); });
      box.appendChild(el('div',{class:'row-item'},[el('span',{class:'nm',text:f.profile.display_name}), el('div',{class:'actions'},[acc,dec])]));
    });

    box.appendChild(el('div',{class:'sectitle',text:'Gesendete Einladungen'}));
    if(!state.outgoing.length) box.appendChild(el('div',{class:'empty',text:'Keine offenen Einladungen.'}));
    state.outgoing.forEach(function(f){
      var cancel=el('button',{type:'button',text:'Zurückziehen'});
      cancel.addEventListener('click',function(){ sb.from('friendships').delete().eq('id',f.friendshipId).then(function(){ loadFriends().then(render); }); });
      box.appendChild(el('div',{class:'row-item'},[el('span',{class:'nm',text:f.profile.display_name}), el('div',{class:'actions'},[cancel])]));
    });

    box.appendChild(el('div',{class:'sectitle',text:'Deine Mitspieler'}));
    if(!state.friends.length) box.appendChild(el('div',{class:'empty',text:'Noch keine Mitspieler verbunden.'}));
    state.friends.forEach(function(f){
      var rm=el('button',{type:'button',text:'Entfernen'});
      rm.addEventListener('click',function(){ if(confirm('Verbindung zu '+f.profile.display_name+' aufheben?')) sb.from('friendships').delete().eq('id',f.friendshipId).then(function(){ loadFriends().then(render); }); });
      box.appendChild(el('div',{class:'row-item'},[el('span',{class:'nm',text:f.profile.display_name}), el('div',{class:'actions'},[rm])]));
    });

    app.appendChild(box);
  }

  /* ---------- Neues Spiel ---------- */
  var setupGuests=[], setupSelected={};
  function openSetup(){
    setupGuests=[]; setupSelected={};
    state.view='setup'; render();
    loadFriends().then(function(){ if(state.view==='setup') render(); });
  }
  function countSelected(){
    var n=1;
    Object.keys(setupSelected).forEach(function(k){ if(setupSelected[k]) n++; });
    return n+setupGuests.length;
  }

  function renderSetup(){
    var box=el('div',{class:'view'});
    var back=el('button',{type:'button',class:'btn ghost',text:'← Start'});
    back.addEventListener('click',function(){ state.view='home'; render(); });
    box.appendChild(back);
    box.appendChild(el('h1',{text:'Neues Spiel'}));
    box.appendChild(el('p',{class:'lead',text:'Wähle deine Mitspieler. Du bist automatisch dabei.'}));

    var titleField=el('input',{type:'text',placeholder:'Titel (optional)',maxlength:'40'});
    box.appendChild(el('div',{class:'field'},[el('label',{text:'Titel'}),titleField]));

    box.appendChild(el('div',{class:'sectitle',text:'Freunde'}));
    if(!state.friends.length) box.appendChild(el('div',{class:'empty',text:'Noch keine Mitspieler verbunden – siehe "Freunde".'}));

    var start=el('button',{type:'button',class:'btn',text:'Spiel starten'});
    var addGuest=el('button',{type:'button',class:'btn ghost',text:'+ Gast hinzufügen'});

    function updateStartState(){
      var n=countSelected();
      start.disabled = n<MIN || n>MAX;
      addGuest.style.display = n<MAX ? '' : 'none';
    }

    state.friends.forEach(function(f){
      var cb=el('input',{type:'checkbox'});
      cb.checked=!!setupSelected[f.profile.id];
      cb.addEventListener('change',function(){ setupSelected[f.profile.id]=cb.checked; updateStartState(); });
      box.appendChild(el('div',{class:'checkrow'},[cb, el('label',{text:f.profile.display_name})]));
    });

    box.appendChild(el('div',{class:'sectitle',text:'Gäste ohne Konto'}));
    var guestList=el('div');
    box.appendChild(guestList);
    function drawGuests(){
      guestList.innerHTML='';
      setupGuests.forEach(function(name,i){
        var inp=el('input',{type:'text',placeholder:'Gast '+(i+1),maxlength:'14'});
        inp.value=name;
        inp.addEventListener('input',function(){ setupGuests[i]=inp.value; });
        var rm=el('button',{type:'button',text:'×'});
        rm.addEventListener('click',function(){ setupGuests.splice(i,1); drawGuests(); updateStartState(); });
        guestList.appendChild(el('div',{class:'prow'},[inp,rm]));
      });
    }
    drawGuests();
    addGuest.addEventListener('click',function(){
      if(countSelected()<MAX){ setupGuests.push(''); drawGuests(); updateStartState(); }
    });
    box.appendChild(addGuest);

    start.addEventListener('click',function(){
      start.disabled=true;
      var players=[{profile_id:state.session.user.id, guest_name:null, display_name:state.profile.display_name}];
      state.friends.forEach(function(f){ if(setupSelected[f.profile.id]) players.push({profile_id:f.profile.id, guest_name:null, display_name:f.profile.display_name}); });
      setupGuests.forEach(function(g){ var nm=g.trim(); if(nm) players.push({profile_id:null, guest_name:nm, display_name:nm}); });
      var scores=ROWS.map(function(){ return players.map(function(){ return null; }); });
      var title=titleField.value.trim() || new Date().toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
      var startDealerSeat=Math.floor(Math.random()*players.length);
      sb.from('games').insert({created_by:state.session.user.id, title:title, players:players, scores:scores, start_dealer_seat:startDealerSeat}).select().single().then(function(res){
        start.disabled=false;
        if(res.error){ alert(res.error.message); return; }
        state.currentGame=res.data; state.view='game'; render();
      });
    });
    updateStartState();
    box.appendChild(start);
    app.appendChild(box);
  }

  /* ---------- Spiel (Scoreboard) ---------- */
  var inputs=[], sums=[], rings=[], saveTimer=null;

  function isEditable(){
    return !!(state.currentGame && state.session && state.currentGame.created_by===state.session.user.id && !state.currentGame.finished_at);
  }

  function renderGame(){
    var game=state.currentGame;
    var players=game.players, n=players.length;
    inputs=[]; sums=[]; rings=[];

    var dealerSeat = (typeof game.start_dealer_seat==='number') ? game.start_dealer_seat : null;
    if(dealerSeat===null){
      dealerSeat = Math.floor(Math.random()*n);
      game.start_dealer_seat = dealerSeat;
      sb.from('games').update({start_dealer_seat:dealerSeat}).eq('id',game.id).then(function(res){ if(res.error) console.error(res.error); });
    }

    var back=el('button',{type:'button',text:'← Start'});
    back.addEventListener('click',function(){ flushSave(); state.currentGame=null; state.view='home'; render(); });
    var actions=el('div',{style:'display:flex;gap:6px'});
    if(state.session && game.created_by===state.session.user.id){
      if(game.finished_at){
        var reopen=el('button',{type:'button',text:'Wieder öffnen'});
        reopen.addEventListener('click',function(){
          sb.from('games').update({finished_at:null}).eq('id',game.id).then(function(res){ if(!res.error){ game.finished_at=null; render(); } });
        });
        actions.appendChild(reopen);
      } else {
        var finish=el('button',{type:'button',text:'Beenden'});
        finish.addEventListener('click',function(){
          if(confirm('Partie als beendet markieren? (kann später wieder geöffnet werden)')){
            flushSave();
            var now=new Date().toISOString();
            sb.from('games').update({finished_at:now}).eq('id',game.id).then(function(res){ if(!res.error){ game.finished_at=now; render(); } });
          }
        });
        actions.appendChild(finish);
      }
    }
    var topbar=el('div',{class:'topbar'},[back, el('h1',{text:game.title||'Spielzettel'}), actions]);
    app.appendChild(topbar);
    if(game.finished_at) app.appendChild(el('p',{class:'finished-note',text:'Beendet am '+new Date(game.finished_at).toLocaleString('de-DE')}));

    var table=el('table');
    var cg=el('colgroup',{},[el('col',{class:'lab'})]);
    for(var p=0;p<n;p++) cg.appendChild(el('col',{class:'pl'}));
    table.appendChild(cg);

    var thead=el('thead'), hr=el('tr');
    hr.appendChild(el('th',{class:'lab-c',text:'Name'}));
    players.forEach(function(pl){ hr.appendChild(el('th',{text:pl.display_name})); });
    thead.appendChild(hr); table.appendChild(thead);

    var editable=isEditable();
    var tbody=el('tbody');
    ROWS.forEach(function(row,r){
      var tr=el('tr',{class:(row.w?'w ':'')+(row.x?'x ':'')+(row.sep?'sep':'')});
      tr.appendChild(el('th',{class:'lab-c',text:row.l,scope:'row'}));
      inputs[r]=[]; sums[r]=[];
      var dealerForRow = (dealerSeat + r) % n;
      for(var p=0;p<n;p++){
        (function(r,p){
          var isDealer = p===dealerForRow;
          var inp=el('input',{class:'v',type:'text',inputmode:'numeric',autocomplete:'off',enterkeyhint:'next','aria-label':'Runde '+row.l+', '+players[p].display_name+(isDealer?', Geber':'')});
          if(!editable) inp.disabled=true;
          var v=game.scores[r][p];
          inp.value = (v===null||v===undefined) ? '' : String(v);
          var s=el('div',{class:'s'});
          var minus=el('button',{type:'button',tabindex:'-1','aria-label':'Vorzeichen wechseln',text:'±'});
          var next=el('button',{type:'button',tabindex:'-1','aria-label':'Nächstes Feld',text:'›'});
          var tools=el('div',{class:'tools'},[minus,next]);
          function press(btn,fn){
            var h=function(e){ e.preventDefault(); fn(); };
            btn.addEventListener('touchstart',h,{passive:false});
            btn.addEventListener('mousedown',h);
          }
          if(editable){
            press(minus,function(){ var t=inp.value; inp.value = t.charAt(0)==='-' ? t.slice(1) : '-'+t; commit(r,p,inp); inp.focus(); });
            press(next,function(){ goNext(r,p); });
            inp.addEventListener('input',function(){ commit(r,p,inp); });
            inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); goNext(r,p); } });
            inp.addEventListener('blur',function(){ flushSave(); });
          }
          inp.addEventListener('focus',function(){ setTimeout(function(){ inp.select(); },0); inp.parentNode.scrollIntoView({block:'nearest',inline:'nearest'}); });
          var cKids=[inp,s,tools];
          if(isDealer) cKids.push(el('span',{class:'dealer-mark',title:'Geber','aria-hidden':'true',text:'G'}));
          var c=el('div',{class:'c'},cKids);
          tr.appendChild(el('td',{},[c]));
          inputs[r][p]=inp; sums[r][p]=s;
        })(r,p);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    var sheet=el('div',{id:'sheet'},[table]);
    app.appendChild(sheet);
    if(n>4) table.style.width=(58+n*82)+'px';

    var totalCg=el('colgroup',{},[el('col',{class:'lab'})]);
    for(var q=0;q<n;q++) totalCg.appendChild(el('col',{class:'pl'}));
    var totalTr=el('tr');
    totalTr.appendChild(el('td',{class:'lab-c',text:'Summe'}));
    for(q=0;q<n;q++){ var ring=el('span',{class:'ring',text:'0'}); rings[q]=ring; totalTr.appendChild(el('td',{},[ring])); }
    var totalTable=el('table',{},[totalCg, el('tbody',{},[totalTr])]);
    var totalbar=el('div',{class:'totalbar'},[totalTable]);
    app.appendChild(totalbar);
    if(n>4) totalTable.style.width=(58+n*82)+'px';
    sheet.addEventListener('scroll',function(){ totalbar.scrollLeft = sheet.scrollLeft; });

    update();
  }

  function commit(r,p,inp){
    var t=inp.value.replace(/[^\d-]/g,'');
    t=(t.charAt(0)==='-'?'-':'')+t.replace(/-/g,'');
    t=t.replace(/^(-?)0+(?=\d)/,'$1');
    if(t.length>6) t=t.slice(0,t.charAt(0)==='-'?7:6);
    inp.value=t;
    var num=parseInt(t,10);
    state.currentGame.scores[r][p]=isNaN(num)?null:num;
    update();
    scheduleSave();
  }
  function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(flushSave,700); }
  function flushSave(){
    clearTimeout(saveTimer);
    if(!state.currentGame || !isEditable()) return;
    var game=state.currentGame;
    sb.from('games').update({scores:game.scores, updated_at:new Date().toISOString()}).eq('id',game.id).then(function(res){ if(res.error) console.error(res.error); });
  }
  function goNext(r,p){
    var n=state.currentGame.players.length, nr=r, np=p+1;
    if(np>=n){ np=0; nr=r+1; }
    if(nr<ROWS.length) inputs[nr][np].focus();
    else inputs[r][p].blur();
  }
  function update(){
    var n=state.currentGame.players.length, tot=[], any=[];
    for(var p=0;p<n;p++){ tot[p]=0; any[p]=false; }
    for(var r=0;r<ROWS.length;r++){
      for(p=0;p<n;p++){
        var v=state.currentGame.scores[r][p];
        if(v!==null&&v!==undefined){ tot[p]+=v; any[p]=true; }
        var s=sums[r][p];
        if(v===null||v===undefined){ s.textContent=''; s.className='s'; }
        else { s.textContent=fmt(tot[p]); s.className='s'+(tot[p]<0?' neg':''); }
        inputs[r][p].classList.toggle('neg', v!==null&&v!==undefined&&v<0);
      }
    }
    var best=-Infinity;
    for(p=0;p<n;p++) if(any[p]&&tot[p]>best) best=tot[p];
    for(p=0;p<n;p++){ rings[p].textContent=fmt(tot[p]); rings[p].className='ring'+(any[p]&&tot[p]===best?' lead':'')+(tot[p]<0?' neg':''); }
  }

  /* ---------- Verlauf ---------- */
  function openHistory(){ state.view='history'; render(); loadHistory(); }
  function loadHistory(){
    return sb.from('games').select('*').order('created_at',{ascending:false}).then(function(res){
      if(res.error){ console.error(res.error); return; }
      state.history=res.data||[];
      if(state.view==='history') render();
    });
  }
  function computeTotals(game){
    var n=game.players.length, tot=[];
    for(var p=0;p<n;p++) tot[p]=0;
    for(var r=0;r<game.scores.length;r++) for(var p=0;p<n;p++){ var v=game.scores[r][p]; if(v!==null&&v!==undefined) tot[p]+=v; }
    return tot;
  }

  function renderHistory(){
    var box=el('div',{class:'view'});
    var back=el('button',{type:'button',class:'btn ghost',text:'← Start'});
    back.addEventListener('click',function(){ state.view='home'; render(); });
    box.appendChild(back);
    box.appendChild(el('h1',{text:'Verlauf'}));

    if(!state.history.length) box.appendChild(el('div',{class:'empty',text:'Noch keine gespeicherten Partien.'}));
    state.history.forEach(function(g){
      var tot=computeTotals(g);
      var best=-Infinity;
      g.players.forEach(function(pl,i){
        var hasAny=g.scores.some(function(row2){return row2[i]!==null&&row2[i]!==undefined;});
        if(hasAny && tot[i]>best) best=tot[i];
      });
      var pills=el('div',{class:'pills'});
      g.players.forEach(function(pl,i){
        var hasAny=g.scores.some(function(row2){return row2[i]!==null&&row2[i]!==undefined;});
        pills.appendChild(el('span',{class:'pill'+((hasAny&&tot[i]===best)?' lead':'')+(tot[i]<0?' neg':''),text:pl.display_name+' '+fmt(tot[i])}));
      });
      var dateStr=new Date(g.created_at).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
      var row=el('button',{type:'button',class:'hist-row'},[
        el('div',{class:'nm',text:g.title||'Spielzettel'}),
        el('div',{class:'sub',text:dateStr+' · '+(g.finished_at?'beendet':'läuft')}),
        pills
      ]);
      row.addEventListener('click',function(){ state.currentGame=g; state.view='game'; render(); });
      box.appendChild(row);
    });

    app.appendChild(box);
  }

  render();
})();
</script>
</body>
</html>
